for (i = 0; i < tablinks.length; i++) {

//document.getElementById(tabName).style.display = "block";
if (tabName == 'DashBoard') {

} else if (tabName == 'DIGI') {

} else if (tabName == 'TRACKER') {

} else if (tabName == 'WX') {

} else if (tabName == 'WXCH') {

} else if (tabName == 'TLM') {

} else if (tabName == 'SENSOR') {

} else if (tabName == 'SCFG') {

{{MQTT_TAB_JS}}} else if (tabName == 'MSG') {

} else if (tabName == 'OBJ') {

} else if (tabName == 'WiFi') {

} else if (tabName == 'MOD') {

} else if (tabName == 'IO') {
$("#contentmain").load("/mod2");
} else if (tabName == 'System') {
$("#contentmain").load("/system");
} else if (tabName == 'File') {
$("#contentmain").load("/storage");
} else if (tabName == 'About') {
$("#contentmain").load("/about");
} else if (tabName == 'PRIME') {
$("#contentmain").load("/prime");
}
if (evt != null) evt.currentTarget.className += " active";
}
if (!!window.EventSource) {var source = new EventSource('/eventHeard');source.addEventListener('open', function(e) {console.log("Events Connected");}, false);source.addEventListener('error', function(e) {if (e.target.readyState != EventSource.OPEN) {console.log("Events Disconnected");}
}, false);source.addEventListener('lastHeard', function(e) {var lh=document.getElementById("aprsTable");if(lh != null) {renderTable(e.data);}}, false);
}if (!!window.EventSource) {var source = new EventSource('/eventMsg');source.addEventListener('open', function(e) {console.log("Events MSG Connected");}, false);source.addEventListener('error', function(e) {if (e.target.readyState != EventSource.OPEN) {console.log("Events MSG Disconnected");}
}, false);source.addEventListener('chatMsg', function(e) {var lh=document.getElementById("chatMsg");if(lh != null) {lh.innerHTML = e.data;}}, false);
}
let sortDirection = {};
let currentSortKey = "time";
function renderTable(raw) {
var data=JSON.parse(raw);
lastHeardSort(data);
document.querySelectorAll("#aprsTable th[data-sort]")
.forEach(header => {
header.addEventListener("click", () => {
const key = header.dataset.sort;
sortDirection[key] = !sortDirection[key];
currentSortKey = key;
clearArrows();
const arrowSpan = header.querySelector(".arrow");
arrowSpan.textContent = sortDirection[key] ? "▲" : "▼";
lastHeardSort(data);
printLastHeard(data);
});
});
printLastHeard(data);
}
function iconFallback(imgEl, iconFile, initial) {
  imgEl.style.display='none';
  var span = imgEl.nextElementSibling;
  if (!span) return;
  span.style.display='inline-flex';
  span.style.alignItems='center';
  span.style.justifyContent='center';
  var code = parseInt(iconFile.split('-')[0], 10);
  var shapes = {
    62: "<svg viewBox='0 0 24 24' width='18' height='18'><rect x='2' y='10' width='20' height='8' rx='2' fill='#1565c0'/><circle cx='7' cy='19' r='2' fill='#333'/><circle cx='17' cy='19' r='2' fill='#333'/></svg>",
    45: "<svg viewBox='0 0 24 24' width='18' height='18'><polygon points='12,3 22,12 19,12 19,21 5,21 5,12 2,12' fill='#8d6e63'/></svg>",
    35: "<svg viewBox='0 0 24 24' width='18' height='18'><polygon points='12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9' fill='#fbc02d'/></svg>",
    95: "<svg viewBox='0 0 24 24' width='18' height='18'><ellipse cx='12' cy='13' rx='9' ry='6' fill='#90a4ae'/></svg>"
  };
  if (shapes[code]) {
    span.innerHTML = shapes[code];
  } else {
    span.style.width='18px'; span.style.height='18px'; span.style.borderRadius='50%';
    span.style.background='#607d8b'; span.style.color='#fff'; span.style.fontSize='11px'; span.style.fontWeight='bold';
    span.style.display='inline-flex'; span.style.alignItems='center'; span.style.justifyContent='center';
    span.textContent = (initial || '?').toUpperCase();
  }
}
function iconError(imgEl, iconFile, initial) {
  if (!imgEl.dataset.stage) {
    imgEl.dataset.stage = 'local';
    imgEl.src = '/symbols/icons/' + iconFile;
  } else {
    iconFallback(imgEl, iconFile, initial);
  }
}
function printLastHeard(data) {
const tableBody = document.getElementById("aprsTableBody");
if(tableBody == null) {return;}
tableBody.innerHTML = "";
data.forEach(row => {
const tr = document.createElement("tr");
tr.innerHTML = `
<td>${row.time}</td>
<td><img src="http://aprs.nakhonthai.net/symbols/icons/${row.icon}" style="width:20px;height:20px;" onerror="iconError(this, '${row.icon}', '${(row.callsign||'?').charAt(0)}');"><span style="display:none;width:20px;height:20px;"></span></td>
<td><a style="text-decoration:underline;" href="https://www.qrz.com/db/${encodeURIComponent(row.callsign.split('-')[0])}" target="_blank" rel="noopener">${row.callsign}</a> <a href="https://aprs.fi/#!z=12&call=a%2F${encodeURIComponent(row.callsign)}&timerange=3600&tail=3600" target="_blank" rel="noopener" title="Ver en aprs.fi">🗺</a></td>
<td align="left">${row.path}</td>
<td>${row.dx !== null ? row.dx : "-"}</td>
<td>${row.packet}</td>
<td style="color:green;">${row.audio !== '-' ? row.audio + "dBV" : "-"}</td>
`;
tableBody.appendChild(tr);
});
}
function clearArrows() {
document.querySelectorAll(".arrow").forEach(a => a.textContent = "");
}
function lastHeardSort(data) {
var key=currentSortKey;
data.sort((a, b) => {
let valA = a[key];
let valB = b[key];
if (key === "time") {
const [dayTime, timePart] = valA.split(' ');
const [hours, minutes, seconds] = timePart.split(':');
valA = parseInt(dayTime) * 86400 + parseInt(hours) * 3600 + parseInt(minutes) * 60 + parseInt(seconds);
const [dayTimeB, timePartB] = valB.split(' ');
const [hoursB, minutesB, secondsB] = timePartB.split(':');
valB = parseInt(dayTimeB) * 86400 + parseInt(hoursB) * 3600 + parseInt(minutesB) * 60 + parseInt(secondsB);
}
if (valA === null) return 1;
if (valB === null) return -1;
if (valA < valB) return sortDirection[key] ? -1 : 1;
if (valA > valB) return sortDirection[key] ? 1 : -1;
return 0;
});
}
</script>
